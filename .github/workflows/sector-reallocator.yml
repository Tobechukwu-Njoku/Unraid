name: sector-reallocator

on:
  push:
    branches: [main]
    paths:
      - 'user-scripts/sector-reallocator/**'
      - '.github/workflows/sector-reallocator.yml'
  pull_request:
    paths:
      - 'user-scripts/sector-reallocator/**'
      - '.github/workflows/sector-reallocator.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ['3.9', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Run offline engine and launcher tests
        run: ./user-scripts/sector-reallocator/tests/run_tests.sh
