name: library-cleaner

on:
  push:
    branches: [main]
    paths:
      - 'user-scripts/library-cleaner/**'
      - '.github/workflows/library-cleaner.yml'
  pull_request:
    paths:
      - 'user-scripts/library-cleaner/**'
      - '.github/workflows/library-cleaner.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: user-scripts/library-cleaner
    steps:
      - uses: actions/checkout@v4

      # Same container the suite runs in locally, so CI and a Mac agree.
      # It also fails if a generated script is stale against src/.
      - name: Run test suite
        run: ./tests/docker-run.sh
